{% extends 'blog/base.html' %}

{% block content %}
<h1>All blog posts</h1>
<ul class="list-group">
    {% for post in posts %}
    <l1 class="list-group-item">
        <a href="{%url 'post_detail' post.id %}">{{ post.title }}</a>
        <p>{{ post.content }}</p>
    </l1>
    {%empty %}
    <p>no posts yet</p>
    {% endfor %}

</ul>
  

{% endblock %}
